<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Auth System</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            color: white;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }
        #createResult, #loginResult {
            margin-top: 10px;
            font-size: 12px;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>🔐 Auth System</h2>

    <h3>Create User</h3>
    <input id="createEmail" placeholder="Email">
    <input id="createPassword" type="password" placeholder="Password">
    <input id="createGroup" placeholder="Group ID">
    <button onclick="createUser()">Create User</button>

    <div id="createResult"></div>

    <h3>Login</h3>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="loginWithKeycloak()">
        Login with Keycloak
    </button>

    <div id="oidcResult"></div>
    <div id="loginResult"></div>
</div>
<script src="http://localhost:8081/js/keycloak.js"></script>
<script>
const keycloak = new Keycloak({
    url: "http://localhost:8081",
    realm: "auth-system",
    clientId: "frontend-app"
});
async function createUser() {
    const email = document.getElementById("createEmail").value;
    const password = document.getElementById("createPassword").value;
    const group_id = document.getElementById("createGroup").value;

    try {
        const res = await fetch("http://127.0.0.1:5000/users/create", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password, group_id })
        });

        const data = await res.json();

        document.getElementById("createResult").innerText =
            JSON.stringify(data, null, 2);

    } catch (err) {
        document.getElementById("createResult").innerText =
            "Error: " + err.message;
    }
}

async function login() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
        const res = await fetch("http://127.0.0.1:5000/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        document.getElementById("loginResult").innerText =
            JSON.stringify(data, null, 2);

    } catch (err) {
        document.getElementById("loginResult").innerText =
            "Error: " + err.message;
    }
}
function loginWithKeycloak() {

    const authUrl =
        "http://localhost:8081/realms/auth-system/protocol/openid-connect/auth" +
        "?client_id=frontend-app" +
        "&response_type=code" +
        "&scope=openid" +
        "&redirect_uri=http://localhost:5500";

    window.location.href = authUrl;
}
</script>

</body>
</html>
