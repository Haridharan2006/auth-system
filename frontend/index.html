<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Authentication System</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">

<i class="fa-solid fa-shield-halved"></i>

</div>

<h1>

Authentication System

</h1>

<p class="subtitle">

Secure Authentication using JWT & OpenID Connect

</p>

<!-- ========================= -->
<!-- Create User -->
<!-- ========================= -->

<div class="section">

<h3 class="section-title">

<i class="fa-solid fa-user-plus"></i>

Create User

</h3>

<div class="input-group">

<label>

Email

</label>

<input

id="createEmail"

type="email"

placeholder="Enter email">

</div>

<div class="input-group">

<label>

Password

</label>

<input

id="createPassword"

type="password"

placeholder="Enter password">

</div>

<div class="input-group">

<label>

Group ID

</label>

<input

id="createGroup"

type="number"

placeholder="1 = Admin, 2 = Developer, 3 = User">

</div>

<button

onclick="createUser()">

<i class="fa-solid fa-user-plus"></i>

Create User

</button>

<div

id="createResult"

class="message">

</div>

</div>

<div class="divider">

<span>

OR

</span>

</div>

<!-- ========================= -->
<!-- Local Login -->
<!-- ========================= -->

<div class="section">

<h3 class="section-title">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</h3>
<div class="input-group">


<div class="input-group">

    <label>Authentication Type</label>

    <div class="auth-toggle">

        <button
            type="button"
            id="localBtn"
            class="auth-btn active"
            onclick="setLoginType('local')">

            <i class="fa-solid fa-user"></i>
            Local

        </button>

        <button
            type="button"
            id="ldapBtn"
            class="auth-btn"
            onclick="setLoginType('ldap')">

            <i class="fa-solid fa-network-wired"></i>
            LDAP

        </button>

    </div>

</div>

</div>
<div class="input-group">

<label id="loginLabel">

Email

</label>

<input
id="loginEmail"
type="text"
placeholder="Enter email">

</div>

<div class="input-group">

<label>

Password

</label>

<input

id="loginPassword"

type="password"

placeholder="Enter password">

</div>

<button

onclick="login()">

<i class="fa-solid fa-lock"></i>

Login

</button>

<div

id="loginResult"

class="message">

</div>

</div>

<div class="divider">

<span>

OpenID Connect

</span>

</div>

<!-- ========================= -->
<!-- OpenID Providers -->
<!-- ========================= -->

<div class="section">

<h3 class="section-title">

<i class="fa-solid fa-key"></i>

Identity Providers

</h3>

<div

id="openidProviders">

</div>

</div>

<div class="footer">

Authentication System

<br>

Internship Project

</div>

</div>

</div>

<script>

// --------------------------------------------------
// Already Logged In
// --------------------------------------------------

if (localStorage.getItem("token")) {

    window.location.href =
        "http://localhost:5500/dashboard.html";

}

// --------------------------------------------------
// Helper
// --------------------------------------------------

function showMessage(id, message, color) {

    const element =
        document.getElementById(id);

    element.innerText = message;

    element.style.color = color;

}

// --------------------------------------------------
// Create User
// --------------------------------------------------

async function createUser() {

    const email =
        document.getElementById("createEmail").value;

    const password =
        document.getElementById("createPassword").value;

    const group_id =
        Number(
            document.getElementById("createGroup").value
        );

    try {

        const response =
            await fetch(
                "http://localhost:5000/users/create",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        group_id
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to create user."
            );

        }

        showMessage(
            "createResult",
            "✅ User created successfully.",
            "green"
        );

        document.getElementById(
            "createEmail"
        ).value = "";

        document.getElementById(
            "createPassword"
        ).value = "";

        document.getElementById(
            "createGroup"
        ).value = "";

    }

    catch (err) {

        showMessage(
            "createResult",
            err.message,
            "red"
        );

    }

}

// --------------------------------------------------
// Local Login
// --------------------------------------------------

async function login() {

    const type = loginType;

    const username =
        document.getElementById("loginEmail").value;

    const password =
        document.getElementById("loginPassword").value;

    let url;

    let body;

    if (type === "ldap") {

        url =
            "http://localhost:5000/ldap/login";

        body = {
            username,
            password
        };

    }
    else {

        url =
            "http://localhost:5000/auth/login";

        body = {
            email: username,
            password
        };

    }

    try {

        const response =
            await fetch(url, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify(body)

            });

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Login failed."
            );

        }

        localStorage.setItem(
            "token",
            data.token
        );

        window.location.href =
            "http://localhost:5500/dashboard.html";

    }

    catch (err) {

        showMessage(
            "loginResult",
            err.message,
            "red"
        );

    }

}

// --------------------------------------------------
// Load OpenID Providers
// --------------------------------------------------

async function loadOpenIDProviders() {

    try {

        const response =
            await fetch(
                "http://localhost:5000/openid/providers"
            );

        if (!response.ok) {

            throw new Error(
                "Unable to load providers."
            );

        }

        const providers =
            await response.json();

        const container =
            document.getElementById(
                "openidProviders"
            );

        container.innerHTML = "";

        providers.forEach(provider => {

            const button =
                document.createElement("button");

            button.className =
                "provider-button";

            button.innerHTML =
                `<i class="fa-solid fa-key"></i> Login with ${provider.name}`;

            button.onclick = () => {

                window.location.href =
                    "http://localhost:5000/openid/login/" +
                    provider.name;

            };

            container.appendChild(button);

        });

    }

    catch (err) {

        console.error(err);

        showMessage(
            "loginResult",
            "Unable to load OpenID providers.",
            "red"
        );

    }

}

// --------------------------------------------------
// Load Page
// --------------------------------------------------
document
.getElementById("loginType")
let loginType = "local";

function setLoginType(type){

    loginType = type;

    document
        .getElementById("localBtn")
        .classList
        .toggle("active", type==="local");

    document
        .getElementById("ldapBtn")
        .classList
        .toggle("active", type==="ldap");

    const label =
        document.getElementById("loginLabel");

    const input =
        document.getElementById("loginEmail");

    if(type==="ldap"){

        label.innerText="Username";

        input.placeholder="Enter LDAP username";

    }else{

        label.innerText="Email";

        input.placeholder="Enter email";

    }

}
window.onload = () => {

    loadOpenIDProviders();

};

</script>

</body>

</html>
