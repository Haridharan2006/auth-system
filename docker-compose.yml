version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: node_backend

    restart: always

    depends_on:
      - postgres

    env_file:
      - ./backend/.env

    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: frontend_server

    restart: always

    ports:
      - "5500:5500"

  nginx:
    image: nginx:latest
    container_name: nginx_server

    restart: always

    depends_on:
      - backend

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  krakend:
    image: devopsfaith/krakend
    container_name: krakend_gateway

    restart: always

    depends_on:
      - nginx

    ports:
      - "8090:8080"

    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json

    command:
      - run
      - -c
      - /etc/krakend/krakend.json

  keycloak:
    image: quay.io/keycloak/keycloak:26.0

    container_name: keycloak

    restart: always

    command: start-dev

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    ports:
      - "8081:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:

  pgdata:

  keycloak_data: